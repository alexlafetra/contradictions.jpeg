<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" >

  <script language="javascript" type="text/javascript" src="jpg_contradictions.js"></script>
  <!-- OK, YOU CAN MAKE CHANGES BELOW THIS LINE AGAIN -->
  <link rel="stylesheet" href="main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
</head>

<body>
  <div id = "app_container">
   
    <div id = "scrollbar_tooltip">
    <-- scroll -->
    </div>

    <!-- toolbar holding save & load icons -->
    <div id = "toolbar">
      <div id = "title">Confession.Jpeg</div>
        <div id = "tools">
        <!-- <div id = "title" class = "toolbar_item">~confess~</div> -->
        <div class = "toolbar_item" onclick = "openFileSelector()">
          upload
          <input type="file" id="file_selector" accept="image/png, image/jpeg" onchange = 'loadNewImageFromFile(event)'/>
        </div>
        <div class = "toolbar_item" onclick = 'saveImage()'>save</div>
        <div class = "toolbar_item" onclick = 'commitTextAndStartNewEntry()'>confess</div>
      </div>
    </div>

    <!-- container holding the main image element -->
    <div id = "image_container">
      <div id = "error_text_container"></div>
      <img id = "processed_image" onclick = "handleClickOnOutputImage(event)" onmousemove="handleDragOnOutputImage(event)">
      <img src = "data/xp_upload_icon.png" style = "width:25px;">
      <img id = "original_image" onclick = "openFileSelector()">
    </div>

    <!-- <img id = "confession_booth" src = 'data/confessional.png'> -->

    <!-- input textArea element -->
    <div id = "text_input_holder">
      <div id = "text_input_tooltip_holder">
        <div id = "text_input_description">write confession:</div>
      </div>
      <textarea id = "text_input_area" oninput = 'parseTextAndRecompile()'></textarea>
    </div>
    <div id = "byte_scrollbar_container" onmousemove = "handleDrag(event)"  onwheel = "handleScroll(event)" onmouseup ="sliderUnclickHandler()" onmousedown="sliderClickHandler()">
      <div id = "byte_scrollbar_pre"></div>
      <div id = "byte_display"></div>
    </div>

    <!-- output text container -->
    <div id = "binary_text_container">
        <!-- error container  -->
      <div id = "error_container">
        <img id = "error_icon" src = "data/xp_error.png">
      </div>
      <div id = "original_text"></div>
    </div>
  </div>
</body>
</html>
